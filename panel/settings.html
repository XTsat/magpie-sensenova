<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SenseNova</title>
    <!-- The bridge is served beside this file and is the only way out of the
         frame: the panel has no network and Magpie's API refuses it otherwise. -->
    <link rel="stylesheet" href="settings.css" />
    <script src="_magpie/bridge.js" defer></script>
    <script src="text.js" defer></script>
    <script src="settings.js" defer></script>
  </head>
  <body>
    <div class="row">
      <label for="locale" data-text="label">Plugin language</label>
      <select id="locale"></select>
      <button id="save" type="button" data-text="save">Save</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="note" id="note" data-text="note"></p>
  </body>
</html>
